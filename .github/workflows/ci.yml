name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-against-localstack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and test dependencies
        run: pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tflocal
        run: pip install terraform-local

      - name: Install lstk CLI
        run: npm install -g @localstack/lstk

      # @localstack/lstk is just the base CLI - the "project" subcommand
      # itself comes from this separate plugin.
      - name: Install lstk-project
        run: pip install "https://localstack-artifacts-internal.s3.eu-central-1.amazonaws.com/packages/lstk-project/lstk_project-0.1.1-py3-none-any.whl"

      # This single command starts LocalStack, resolves the project config for
      # test-whummer, and installs/configures the LocalStack Extensions the app
      # needs (mock Stripe, Xero and Anthropic endpoints). No manual setup.
      - name: Start LocalStack project
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: lstk project start test-whummer

      - name: Deploy to LocalStack
        run: make deploy-local PROJECT_ID=test-whummer

      - name: Run tests
        run: make test

      - name: Stop LocalStack project
        if: always()
        run: lstk project stop test-whummer
