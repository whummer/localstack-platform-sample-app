name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-against-localstack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and test dependencies
        run: pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tflocal
        run: pip install terraform-local

      - name: Install lstk CLI
        run: npm install -g @localstack/lstk

      # @localstack/lstk is just the base CLI - the "project" subcommand
      # itself comes from this separate plugin.
      - name: Install lstk-project
        run: pip install "https://localstack-artifacts-internal.s3.eu-central-1.amazonaws.com/packages/lstk-project/lstk_project-0.1.1-py3-none-any.whl"

      # make deploy-local's local-up target runs "lstk project start" itself
      # (resolving test-whummer's config and installing/configuring the
      # LocalStack Extensions the app needs), so there's no separate start
      # step here - just make sure the auth token is in scope for it.
      - name: Deploy to LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: make deploy-local PROJECT_ID=test-whummer

      - name: Run tests
        run: make test

      - name: Stop LocalStack project
        if: always()
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: lstk project shutdown test-whummer --status ${{ job.status }}
