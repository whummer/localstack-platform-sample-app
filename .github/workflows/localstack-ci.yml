# Generated by the LocalStack platform for project "test-whummer".
# localstack-project-id: proj_261c6282
# Manage it from https://v2.app.localstack.cloud/projects/proj_261c6282 -
# "Update CI workflow" there opens a fresh PR when the config changes.
#
# Authenticates via GitHub Actions OIDC - no repository secret
# needed. Configured from the project's settings on the platform.
name: LocalStack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Preview of the standalone localstack/github-oidc-action - for now
      # this lives in-repo at .github/actions/localstack-oidc-auth.
      - name: Authenticate to LocalStack via GitHub OIDC
        uses: ./.github/actions/localstack-oidc-auth
        with:
          org-id: "1e09b0c1"
          project: "proj_261c6282"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the lstk CLI
        run: npm install -g @localstack/lstk

      - name: Install lstk-project
        run: pip install "https://localstack-artifacts-internal.s3.eu-central-1.amazonaws.com/packages/lstk-project/lstk_project-0.1.1-py3-none-any.whl"

      - name: "Start LocalStack for test-whummer"
        run: lstk project start "test-whummer"

      - uses: hashicorp/setup-terraform@v3

      - name: Deploy infrastructure (Terraform)
        working-directory: "infra"
        run: |
          ../scripts/build_lambda.sh && lstk terraform init && lstk terraform apply -auto-approve

      # No test command configured on the platform yet - this step just
      # verifies the emulator came up. Set one on the project, then use
      # "Update CI workflow" to render it here.
      - name: Verify LocalStack is healthy
        run: curl -sf localhost:4566/_localstack/health

      - name: Show LocalStack logs
        if: always()
        run: docker logs --tail 200 localstack-aws || true

      - name: Generate a diagnostic report
        if: failure()
        run: curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: localstack-diagnose
          path: diagnose.json.gz

      - name: "Shut down LocalStack for test-whummer"
        if: always()
        continue-on-error: true
        run: lstk project shutdown "test-whummer" --status ${{ job.status }}
