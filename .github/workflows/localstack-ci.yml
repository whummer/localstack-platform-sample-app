# Generated by the LocalStack platform for project "test-whummer".
# localstack-project-id: proj_261c6282
# Manage it from https://v2.app.localstack.cloud/projects/proj_261c6282 -
# "Update CI workflow" there opens a fresh PR when the config changes.
#
# Authenticates via GitHub Actions OIDC - no repository secret
# needed. Configured from the project's settings on the platform.
name: LocalStack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to LocalStack via GitHub OIDC
        run: |
          OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://v2.api.localstack.cloud/github-oidc" | jq -r .value)
          echo "DEBUG: OIDC_TOKEN length=${#OIDC_TOKEN}, aud/iss/ref claims:"
          CLAIMS_SEG=$(echo "$OIDC_TOKEN" | cut -d. -f2 | tr '_-' '/+')
          CLAIMS_SEG="${CLAIMS_SEG}$(printf '=%.0s' $(seq 1 $(( (4 - ${#CLAIMS_SEG} % 4) % 4 ))))"
          echo "$CLAIMS_SEG" | base64 -d 2>/dev/null | jq '{aud,iss,ref,repository,sub}' || echo "(could not decode claims)"
          PAYLOAD=$(jq -n --arg token "$OIDC_TOKEN" --arg orgId "1e09b0c1" --arg project "proj_261c6282" '{token: $token, orgId: $orgId, project: $project}')
          HTTP_RESPONSE=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST "https://v2.api.localstack.cloud/v1/auth/github-oidc" -H "Content-Type: application/json" -d "$PAYLOAD")
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tail -1 | cut -d: -f2)
          echo "DEBUG: platform response status=$STATUS body=$BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::OIDC exchange failed (status $STATUS): $BODY"
            exit 1
          fi
          echo "LOCALSTACK_AUTH_TOKEN=$(echo "$BODY" | jq -r .localstackAuthToken)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the lstk CLI
        run: npm install -g @localstack/lstk

      - name: Install lstk-project
        run: pip install "https://localstack-artifacts-internal.s3.eu-central-1.amazonaws.com/packages/lstk-project/lstk_project-0.1.1-py3-none-any.whl"

      - name: "Start LocalStack for test-whummer"
        run: lstk project start "test-whummer"

      - uses: hashicorp/setup-terraform@v3

      - name: Deploy infrastructure (Terraform)
        run: |
          lstk terraform init && lstk terraform apply -auto-approve

      # No test command configured on the platform yet - this step just
      # verifies the emulator came up. Set one on the project, then use
      # "Update CI workflow" to render it here.
      - name: Verify LocalStack is healthy
        run: curl -sf localhost:4566/_localstack/health

      - name: Show LocalStack logs
        if: always()
        run: docker logs --tail 200 localstack-aws || true

      - name: Generate a diagnostic report
        if: failure()
        run: curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: localstack-diagnose
          path: diagnose.json.gz

      - name: "Shut down LocalStack for test-whummer"
        if: always()
        continue-on-error: true
        run: lstk project shutdown "test-whummer" --status ${{ job.status }}
